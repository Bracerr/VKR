# Полный стенд для pytest.
# Секреты подставляются из корня репозитория: `cp .env.example .env` и `make test-up`
# (Makefile передаёт `--env-file` при наличии `.env`).
# Порты не пересекаются с dev (28080 auth, 28090 wh, 28091 sed, 28081 KC).
services:
  pg-auth:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${PG_AUTH_PASSWORD:-auth}
      POSTGRES_DB: auth
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [e2e]

  pg-wh:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wh
      POSTGRES_PASSWORD: ${PG_WH_PASSWORD:-wh}
      POSTGRES_DB: warehouse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wh -d warehouse"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [e2e]

  pg-sed:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sed
      POSTGRES_PASSWORD: ${PG_SED_PASSWORD:-sed}
      POSTGRES_DB: sed
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sed -d sed"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [e2e]

  pg-prod:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prod
      POSTGRES_PASSWORD: ${PG_PROD_PASSWORD:-prod}
      POSTGRES_DB: prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prod -d prod"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [e2e]

  pg-proc:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: proc
      POSTGRES_PASSWORD: ${PG_PROC_PASSWORD:-proc}
      POSTGRES_DB: procurement
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proc -d procurement"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [e2e]

  pg-sales:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: ${PG_SALES_PASSWORD:-sales}
      POSTGRES_DB: sales
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales -d sales"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [e2e]

  pg-trace:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trace
      POSTGRES_PASSWORD: ${PG_TRACE_PASSWORD:-trace}
      POSTGRES_DB: trace
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trace -d trace"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [e2e]

  kafka:
    # Confluent Kafka (KRaft): совместимее со старыми CPU, чем Redpanda (exit 132 = SIGILL без AVX).
    image: confluentinc/cp-kafka:7.6.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 45s
    networks: [e2e]

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z-cpuv1
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}
    networks: [e2e]

  keycloak:
    image: quay.io/keycloak/keycloak:20.0.5
    command: ["start-dev", "--http-enabled=true", "--hostname-strict=false"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "28081:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 120s
    networks: [e2e]

  auth-service:
    build:
      context: ../..
      dockerfile: auth-service/Dockerfile
    depends_on:
      pg-auth:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: on-failure:5
    environment:
      CONFIG_PATH: /app/configs/docker.yaml
      HTTP_ADDR: ":8080"
      LOG_LEVEL: debug
      DB_DSN: postgres://auth:${PG_AUTH_PASSWORD:-auth}@pg-auth:5432/auth?sslmode=disable
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:28081}
      KEYCLOAK_ADMIN_REALM: master
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KEYCLOAK_REALM: industrial-sed
      KEYCLOAK_CLIENT_ID: auth-service
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-dev-client-secret-change-me}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:28080}
      SERVICE_SECRET: ${AUTH_SERVICE_SECRET:-e2e-service-secret}
      TEST_SECRET: ${AUTH_TEST_SECRET:-e2e-test-secret}
      STATE_COOKIE_SECRET: ${AUTH_STATE_COOKIE_SECRET:-0123456789abcdef0123456789abcdef}
      ENABLE_TEST_ENDPOINTS: "true"
      BOOTSTRAP_SUPERADMIN: "true"
      BOOTSTRAP_SUPERADMIN_USERNAME: superadmin
      BOOTSTRAP_SUPERADMIN_PASSWORD: ${AUTH_BOOTSTRAP_SUPERADMIN_PASSWORD:-superadmin}
      NOTIFIER_TYPE: ${NOTIFIER_TYPE:-kafka}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_TOPIC_USER_EVENTS: ${KAFKA_TOPIC_USER_EVENTS:-vkr.auth.user.created}
      RUN_MIGRATIONS_ON_START: "true"
      OTEL_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    networks: [e2e]

  warehouse-service:
    build:
      context: ../..
      dockerfile: warehouse-service/Dockerfile
    depends_on:
      pg-wh:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: on-failure:5
    environment:
      CONFIG_PATH: /app/configs/docker.yaml
      DB_DSN: postgres://wh:${PG_WH_PASSWORD:-wh}@pg-wh:5432/warehouse?sslmode=disable
      KEYCLOAK_URL: http://keycloak:8080
      SERVICE_SECRET: ${WAREHOUSE_SERVICE_SECRET:-sed-e2e-wh-secret}
      TRACEABILITY_BASE_URL: http://traceability-service:8095
      TRACEABILITY_SECRET: ${TRACEABILITY_SECRET:-e2e-trace-secret}
      EVENT_TRANSPORT: ${EVENT_TRANSPORT:-kafka}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_CONSUMER_OFFSET: ${KAFKA_CONSUMER_OFFSET:-earliest}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8090/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    networks: [e2e]

  production-service:
    build:
      context: ../..
      dockerfile: production-service/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      pg-prod:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      warehouse-service:
        condition: service_started
    restart: on-failure:5
    environment:
      CONFIG_PATH: /app/configs/docker.yaml
      HTTP_ADDR: ":8092"
      LOG_LEVEL: debug
      DB_DSN: postgres://prod:${PG_PROD_PASSWORD:-prod}@pg-prod:5432/prod?sslmode=disable
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: industrial-sed
      KEYCLOAK_CLIENT_ID: auth-service
      RUN_MIGRATIONS_ON_START: "true"
      WAREHOUSE_BASE_URL: http://warehouse-service:8090
      WAREHOUSE_SERVICE_SECRET: ${WAREHOUSE_SERVICE_SECRET:-sed-e2e-wh-secret}
      SED_BASE_URL: http://sed-service:8091
      SED_CALLBACK_VERIFY_SECRET: ${SED_CALLBACK_PRODUCTION_SECRET:-e2e-prod-callback-secret}
      TRACEABILITY_BASE_URL: http://traceability-service:8095
      TRACEABILITY_SECRET: ${TRACEABILITY_SECRET:-e2e-trace-secret}
      EVENT_TRANSPORT: ${EVENT_TRANSPORT:-kafka}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_CONSUMER_OFFSET: ${KAFKA_CONSUMER_OFFSET:-earliest}
    networks: [e2e]

  procurement-service:
    build:
      context: ../..
      dockerfile: procurement-service/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      pg-proc:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      warehouse-service:
        condition: service_started
      sed-service:
        condition: service_started
    restart: on-failure:5
    environment:
      CONFIG_PATH: /app/configs/docker.yaml
      HTTP_ADDR: ":8093"
      LOG_LEVEL: debug
      DB_DSN: postgres://proc:${PG_PROC_PASSWORD:-proc}@pg-proc:5432/procurement?sslmode=disable
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: industrial-sed
      KEYCLOAK_CLIENT_ID: auth-service
      RUN_MIGRATIONS_ON_START: "true"
      WAREHOUSE_BASE_URL: http://warehouse-service:8090
      WAREHOUSE_SERVICE_SECRET: ${WAREHOUSE_SERVICE_SECRET:-sed-e2e-wh-secret}
      SED_BASE_URL: http://sed-service:8091
      SED_CALLBACK_VERIFY_SECRET: ${SED_CALLBACK_PROCUREMENT_SECRET:-e2e-proc-callback-secret}
      TRACEABILITY_BASE_URL: http://traceability-service:8095
      TRACEABILITY_SECRET: ${TRACEABILITY_SECRET:-e2e-trace-secret}
      EVENT_TRANSPORT: ${EVENT_TRANSPORT:-kafka}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_CONSUMER_OFFSET: ${KAFKA_CONSUMER_OFFSET:-earliest}
    networks: [e2e]

  sales-service:
    build:
      context: ../..
      dockerfile: sales-service/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      pg-sales:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      warehouse-service:
        condition: service_started
      sed-service:
        condition: service_started
    restart: on-failure:5
    environment:
      CONFIG_PATH: /app/configs/docker.yaml
      HTTP_ADDR: ":8094"
      LOG_LEVEL: debug
      DB_DSN: postgres://sales:${PG_SALES_PASSWORD:-sales}@pg-sales:5432/sales?sslmode=disable
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: industrial-sed
      KEYCLOAK_CLIENT_ID: auth-service
      RUN_MIGRATIONS_ON_START: "true"
      WAREHOUSE_BASE_URL: http://warehouse-service:8090
      WAREHOUSE_SERVICE_SECRET: ${WAREHOUSE_SERVICE_SECRET:-sed-e2e-wh-secret}
      SED_BASE_URL: http://sed-service:8091
      SED_CALLBACK_VERIFY_SECRET: ${SED_CALLBACK_SALES_SECRET:-e2e-sales-callback-secret}
      TRACEABILITY_BASE_URL: http://traceability-service:8095
      TRACEABILITY_SECRET: ${TRACEABILITY_SECRET:-e2e-trace-secret}
      EVENT_TRANSPORT: ${EVENT_TRANSPORT:-kafka}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_CONSUMER_OFFSET: ${KAFKA_CONSUMER_OFFSET:-earliest}
    networks: [e2e]

  traceability-service:
    build:
      context: ../..
      dockerfile: traceability-service/Dockerfile
    depends_on:
      pg-trace:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: on-failure:5
    environment:
      CONFIG_PATH: /app/configs/docker.yaml
      HTTP_ADDR: ":8095"
      LOG_LEVEL: debug
      DB_DSN: postgres://trace:${PG_TRACE_PASSWORD:-trace}@pg-trace:5432/trace?sslmode=disable
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: industrial-sed
      KEYCLOAK_CLIENT_ID: auth-service
      RUN_MIGRATIONS_ON_START: "true"
      TRACE_INGEST_SECRET: ${TRACE_INGEST_SECRET:-e2e-trace-secret}
      EVENT_TRANSPORT: ${EVENT_TRANSPORT:-kafka}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_CONSUMER_OFFSET: ${KAFKA_CONSUMER_OFFSET:-earliest}
    networks: [e2e]

  sed-service:
    build:
      context: ../..
      dockerfile: sed-service/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      pg-sed:
        condition: service_healthy
      minio:
        condition: service_started
      keycloak:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      warehouse-service:
        condition: service_healthy
      production-service:
        condition: service_started
    restart: on-failure:5
    environment:
      CONFIG_PATH: /app/configs/docker.yaml
      DB_DSN: postgres://sed:${PG_SED_PASSWORD:-sed}@pg-sed:5432/sed?sslmode=disable
      WAREHOUSE_SERVICE_SECRET: ${WAREHOUSE_SERVICE_SECRET:-sed-e2e-wh-secret}
      WAREHOUSE_BASE_URL: http://warehouse-service:8090
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minio12345}
      KEYCLOAK_URL: http://keycloak:8080
      PRODUCTION_CALLBACK_URL: http://production-service:8092
      PRODUCTION_CALLBACK_SECRET: ${SED_CALLBACK_PRODUCTION_SECRET:-e2e-prod-callback-secret}
      PROCUREMENT_CALLBACK_URL: http://procurement-service:8093
      PROCUREMENT_CALLBACK_SECRET: ${SED_CALLBACK_PROCUREMENT_SECRET:-e2e-proc-callback-secret}
      SALES_CALLBACK_URL: http://sales-service:8094
      SALES_CALLBACK_SECRET: ${SED_CALLBACK_SALES_SECRET:-e2e-sales-callback-secret}
      AUTH_SERVICE_BASE_URL: http://auth-service:8080
      AUTH_SERVICE_SECRET: ${AUTH_SERVICE_SECRET:-e2e-service-secret}
      RAG_CORPUS_SECRET: ${RAG_CORPUS_SECRET:-${AUTH_SERVICE_SECRET:-e2e-service-secret}}
      RAG_CORPUS_BASE_URL: ${API_PUBLIC_URL:-http://localhost:5656}
      EVENT_TRANSPORT: ${EVENT_TRANSPORT:-kafka}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_CONSUMER_OFFSET: ${KAFKA_CONSUMER_OFFSET:-earliest}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8091/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 45s
    networks: [e2e]

networks:
  e2e:
    driver: bridge
