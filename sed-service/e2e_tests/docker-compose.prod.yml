# Прод-стек: один внешний порт (gateway) + автоматический RAG seed.
# make prod-up = docker-compose.test.yml + этот файл

services:
  keycloak:
    environment:
      KC_PROXY: edge
      KC_HOSTNAME_STRICT: "false"
      # Публичный хост:порт gateway (без http://) — иначе редиректы на keycloak_upstream / localhost.
      KC_HOSTNAME: ${KC_HOSTNAME:-85.236.191.21}
      # Порт в URL браузера (WAN), не хост-порт Docker.
      KC_HOSTNAME_PORT: ${API_GATEWAY_PUBLIC_PORT:-52556}

  auth-service:
    environment:
      # Должны совпадать с URL в браузере (не localhost, если заходите с другой машины).
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:?set KEYCLOAK_PUBLIC_URL in .env e.g. http://85.236.191.21:52556}
      API_PUBLIC_URL: ${API_PUBLIC_URL:?set API_PUBLIC_URL in .env e.g. http://85.236.191.21:52556}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # Создание пользователей не должно падать из‑за Kafka (иначе rag-seed: 500).
      NOTIFIER_TYPE: ${NOTIFIER_TYPE:-mock}

  gateway:
    image: nginx:1.26-alpine
    # Хост-порт = API_GATEWAY_HOST_PORT; внутри контейнера nginx = 5656.
    # Роутер: WAN 52556 (API_GATEWAY_PUBLIC_PORT) → LAN host API_GATEWAY_HOST_PORT (5566), не 5656.
    ports:
      - "${API_GATEWAY_HOST_PORT:-5566}:5656"
    volumes:
      - ../../prod-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      auth-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      warehouse-service:
        condition: service_healthy
      sed-service:
        condition: service_healthy
      production-service:
        condition: service_started
      procurement-service:
        condition: service_started
      sales-service:
        condition: service_started
      traceability-service:
        condition: service_started
    networks: [e2e]
    restart: unless-stopped

  rag-seed:
    image: python:3.12-alpine
    working_dir: /vkr
    volumes:
      - ../..:/vkr
    environment:
      RAG_FIXTURES_ENABLED: "true"
      RAG_FIXTURES_TENANT: ${RAG_FIXTURES_TENANT:-ragcorp}
      RAG_FIXTURES_PASSWORD: ${RAG_FIXTURES_PASSWORD:-RagTest2026!}
      RAG_FIXTURES_OUTPUT: /vkr/docs/rag/generated
      AUTH_BASE_URL: http://auth-service:8080
      SED_BASE_URL: http://sed-service:8091
      WAREHOUSE_BASE_URL: http://warehouse-service:8090
      AUTH_TEST_SECRET: ${AUTH_TEST_SECRET:-e2e-test-secret}
      WAREHOUSE_SERVICE_SECRET: ${WAREHOUSE_SERVICE_SECRET:-sed-e2e-wh-secret}
    command: ["python3", "/vkr/scripts/seed_rag_fixtures.py", "--force"]
    depends_on:
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      warehouse-service:
        condition: service_healthy
      sed-service:
        condition: service_healthy
    networks: [e2e]
    restart: "on-failure:3"
