# Публикация портов на хост — только для локальной отладки и pytest (make test-up).
# Прод: make prod-up без этого файла — снаружи только API Gateway.

services:
  kafka:
    ports:
      - "29092:9092"

  minio:
    ports:
      - "29000:9000"
      - "29001:9001"

  keycloak:
