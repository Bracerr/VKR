      - "28090:8090"

  production-service:
    ports:
      - "28092:8092"

  procurement-service:
    ports:
      - "28093:8093"

  sales-service:
    ports:
      - "28094:8094"

  traceability-service:
    ports:
      - "28095:8095"

  sed-service:
    ports:
      - "28091:8091"
